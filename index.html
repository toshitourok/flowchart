<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>atama+ おすすめ科目診断</title>
<style>
:root{--navy:#17345f;--blue:#2878c8;--pale:#eef7ff;--green:#268866;--text:#243247;--muted:#66758a;--line:#d9e5ef}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(160deg,#eef8ff,#f8fbfd 55%,#f2faf6);color:var(--text);line-height:1.7}
.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}.brand{font-weight:800;color:var(--navy);font-size:14px;letter-spacing:.04em}.card{background:#fff;border:1px solid #e6eef5;border-radius:22px;box-shadow:0 12px 32px rgba(29,69,105,.09);padding:30px;margin-top:15px}h1{font-size:clamp(28px,6vw,40px);line-height:1.25;margin:.25em 0;color:var(--navy)}h2{line-height:1.4;color:var(--navy)}.lead{font-size:17px}.note{background:var(--pale);padding:15px 18px;border-radius:14px;color:#365672}.btn{width:100%;border:0;border-radius:14px;padding:15px 18px;margin:8px 0;background:#f6f9fc;color:var(--text);font-size:16px;font-weight:700;text-align:left;cursor:pointer;border:2px solid transparent}.btn:hover,.btn:focus{border-color:#78abe0;background:#edf6ff}.primary{background:var(--blue);color:#fff;text-align:center}.primary:hover{background:#1d67b0}.secondary{text-align:center;border:1px solid var(--line)}.progress{height:8px;background:#e7eef5;border-radius:99px;overflow:hidden;margin:15px 0 26px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),#51aa8a);transition:.25s}.step{color:var(--muted);font-size:14px}.result{border-left:5px solid var(--green);background:#f3fbf7;padding:15px 17px;border-radius:10px;margin:12px 0}.subject{font-size:20px;font-weight:800;color:var(--navy)}.why{margin:.2em 0}.priority{display:inline-block;background:#e5f4ed;color:#176a50;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}.small{font-size:14px;color:var(--muted)}.hidden{display:none}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head><body><main class="wrap"><div class="brand">長浜バイオ大学 入学前教育/atama+</div><section class="card" id="app"></section><div class="footer">この診断は受講科目を選ぶための目安です。回答内容は保存・送信されません。</div></main>
<script>
const app=document.getElementById('app');
let a={chem:false,bio:false,eng:false,math:false,chemWhy:'',bioWhy:'',engWhy:'',mathWhy:'',junior:null};let idx=0;
const qs=[
 {title:'高校で「化学」を履修しましたか？',sub:'「化学基礎」のみ履修した場合は、「化学基礎のみ」を選んでください。',opts:[['化学を履修した','chem_taken'],['化学基礎のみ履修した','chem_basic'],['化学基礎・化学とも履修していない','chem_none']]},
 {title:'化学の内容を、だいたい理解できていますか？',sub:'高校で「化学」を履修した方への質問です。',opts:[['おおむね理解できている','chem_ok'],['あまり理解できていない／自信がない','chem_weak']]},
 {title:'高校で「生物」を履修しましたか？',sub:'「生物基礎」のみ履修した場合は、「生物基礎のみ」を選んでください。',opts:[['生物を履修した','bio_taken'],['生物基礎のみ履修した','bio_basic'],['生物基礎・生物とも履修していない','bio_none']]},
 {title:'生物の内容を、だいたい理解できていますか？',sub:'高校で「生物」を履修した方への質問です。',opts:[['おおむね理解できている','bio_ok'],['あまり理解できていない／自信がない','bio_weak']]},
 {title:'英語に苦手意識がありますか？',sub:'英語の授業や問題に取り組むことへの不安も含めて考えてください。',opts:[['はい、不安がある','eng_yes'],['いいえ、あまり不安はない','eng_no']]},
 {title:'数学に苦手意識がありますか？',sub:'計算や数学の問題を解くことへの不安も含めて考えてください。',opts:[['はい、不安がある','math_yes'],['いいえ、あまり不安はない','math_no']]}
];
function start(){idx=0;a={chem:false,bio:false,eng:false,math:false,chemWhy:'',bioWhy:'',engWhy:'',mathWhy:'',junior:null};renderQ()}
function home(){app.innerHTML=`<div class="step">atama+おすすめ科目診断</div><h1>あなたに合った<br>atama+科目をチェック！</h1><p class="lead">いくつかの質問に答えると、あなたにおすすめのatama+科目がわかります。</p><div class="note"><b>学習の目安</b><br>atama+では、共通テストで平均点程度を取れる力を身につけることを目標としています。高校で履修していない科目や、自信がない・苦手意識がある科目の学び直しに活用できます。</div><p class="small">受講できる科目：化学・生物学・英語・数学</p><button class="btn primary" onclick="start()">診断をはじめる</button>`}
function renderQ(){let q=qs[idx];app.innerHTML=`<div class="step">質問 ${idx+1} / ${qs.length}</div><div class="progress"><div class="bar" style="width:${(idx+1)/qs.length*100}%"></div></div><h2>${q.title}</h2><p>${q.sub}</p>${q.opts.map(o=>`<button class="btn" onclick="answer('${o[1]}')">${o[0]}</button>`).join('')}<button class="btn secondary" onclick="home()">最初からやり直す</button>`}
function answer(v){if(v==='chem_basic'||v==='chem_none'){a.chem=true;a.chemWhy=v==='chem_basic'?'「化学基礎」のみ履修しているため':'高校で「化学」を履修していないため';idx=2;return renderQ()} if(v==='chem_taken'){idx=1;return renderQ()} if(v==='chem_weak'){a.chem=true;a.chemWhy='化学の理解に不安があるため'} if(v==='chem_ok'){a.chem=false} if(v==='bio_basic'||v==='bio_none'){a.bio=true;a.bioWhy=v==='bio_basic'?'「生物基礎」のみ履修しているため':'高校で「生物」を履修していないため';idx=4;return renderQ()} if(v==='bio_taken'){idx=3;return renderQ()} if(v==='bio_weak'){a.bio=true;a.bioWhy='生物の理解に不安があるため'} if(v==='bio_ok'){a.bio=false} if(v==='eng_yes'){a.eng=true;a.engWhy='英語に苦手意識・不安があるため'} if(v==='math_yes'){a.math=true;a.mathWhy='数学に苦手意識・不安があるため'} idx++;if(idx>=qs.length)return decide();renderQ()}
function decide(){let n=['chem','bio','eng','math'].filter(k=>a[k]).length;if(n>=3)return junior();results()}
function junior(){app.innerHTML=`<div class="step">最後の質問</div><div class="progress"><div class="bar" style="width:100%"></div></div><h2>中学校レベルの英語・数学に不安がありますか？</h2><p>おすすめになった科目が多い場合の、優先順位を決めるための質問です。</p><button class="btn" onclick="a.junior=true;results()">はい、不安がある</button><button class="btn" onclick="a.junior=false;results()">いいえ、おおむね大丈夫</button>`}
function results(){let r=[['chem','🧪','化学'],['bio','🧬','生物学'],['eng','🔤','英語'],['math','➗','数学']].filter(x=>a[x[0]]);let html='<div class="step">診断結果</div><h1>あなたへのおすすめ</h1>';if(!r.length){html+=`<div class="result"><div class="subject">現時点では、優先して受講をおすすめする科目はありません</div><p>入学前に復習しておきたい科目がある場合は、希望に応じて受講できます。</p></div>`}else{if(r.length<=2){html+=`<p class="lead"><b>${r.map(x=>x[2]).join('・')}</b> の受講をおすすめします。</p>`}else{let preferred=a.junior?['eng','math']:['chem','bio'];let p=r.filter(x=>preferred.includes(x[0]));if(p.length<2)p=[...p,...r.filter(x=>!p.includes(x))].slice(0,2);html+=`<div class="note"><b>まずは ${p.map(x=>x[2]).join('・')} を優先するのがおすすめです。</b><br>${a.junior?'中学校レベルの英語・数学に不安があるという回答から、英語・数学を優先しました。':'中学校レベルの英語・数学はおおむね大丈夫という回答から、化学・生物学を優先しました。'}</div>`}html+=r.map(x=>`<div class="result"><span class="priority">受講がおすすめ</span><div class="subject">${x[1]} ${x[2]}</div><p class="why">${a[x[0]+'Why']||'基礎から学び直すことをおすすめします'}。</p></div>`).join('');html+=`<p><b>4科目すべて受講することもできます。</b> ただし、学習量は少なくありません。特におすすめの科目を2科目程度選び、選択した科目にしっかり取り組むことをおすすめします。</p>`}html+=`<button class="btn primary" onclick="start()">もう一度診断する</button><p class="small">※この結果は、入力した回答をもとにした受講科目選択の目安です。</p>`;app.innerHTML=html}
home();
</script></body></html>
